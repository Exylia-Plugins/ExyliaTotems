plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.11'
    id("io.freefair.lombok") version "8.14"
}

def pluginName = 'ExyliaTotems'
def mainPackage = 'net.exylia'
def outputDirectory = "/root/Java/jars/plugins"

group = mainPackage
version = '1.0.0'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url "https://maven.enginehub.org/repo/" }
    maven { url "https://repo.dmulloy2.net/repository/public/" }
    maven { url "https://repo.codemc.org/repository/maven-public/" }
    maven { url "https://repository.minecodes.pl/releases" }
    maven {
        name = "minecraft-libraries"
        url = uri("https://libraries.minecraft.net")
    }
    maven {
        name = "sundevs"
        url = uri("https://repo.hapangama.com/releases")
    }
}

dependencies {
    implementation("${mainPackage}:ExyliaCommons:1.0.0")
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly("com.github.retrooper:packetevents-spigot:2.13.0")
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveBaseName.set(pluginName)
    archiveClassifier.set('')
    destinationDirectory = file(outputDirectory)
    minimize()
    relocate "${mainPackage}.commons", "${mainPackage}.libs.commons"
    relocate "com.hapangama", "${mainPackage}.libs.sl"
    relocate "com.github.lalyos.jfiglet", "${mainPackage}.libs.jfiglet"
}
